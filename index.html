الجسم، يقيس مستوى الجلوكوز (السكر) في الدم.</p>\n                    </div>\n                    \n                    <div class=\"detail-section\">\n                        <h3> الغرض من الفحص:</h3>\n                        <ul class=\"detail-list\">\n                            <li>يستخدم لتشخيص مرض السكري</li>\n                            <li>مراقبة مستوى السكر لدى مرضى السكري</li>\n                            <li>تحديد انخفاض أو ارتفاع السكر في الدم</li>\n                        </ul>\n                    </div>\n                    \n                    <div class=\"detail-section\">\n                        <h3> التحضير للفحص:</h3>\n                        <p>يتم جمع عينة الدم في الصباح بعد الصيام لمدة 8 ساعات على الأقل.</p>\n                    </div>\n                    \n                    <div class=\"detail-section\">\n                        <h3> مدة ظهور النتيجة:</h3>\n                        <p>تظهر نتيجة التحليل في اليوم التالي.</p>\n                    </div>\n                </div>\n            \n                \n                \n                <div class=\"analysis-detail-card\">\n                    <h2> تحليل الكوليسترول والدهون</h2>\n                    \n                    <div class=\"detail-section\">\n                        <h3> الوصف:</h3>\n                        <p>فحص لمستوى الدهون في الدم، يشمل الكوليسترول الكلي، الكوليسترول الجيد (HDL)، الكوليسترول الضار (LDL)، والدهون الثلاثية.</p>\n                    </div>\n                    \n                    <div class=\"detail-section\">\n                        <h3> الغرض من الفحص:</h3>\n                        <ul class=\"detail-list\">\n                            <li>تقييم خطر الإصابة بأمراض القلب والأوعية الدموية</li>\n                            <li>مراقبة فعالية علاج خفض الدهون</li>\n                            <li>الكشف عن اضطرابات الدهون في الدم</li>\n                            <li>توجيه قرارات العلاج والوقاية</li>\n                        </ul>\n                    </div>\n                    \n                    <div class=\"detail-section\">\n                        <h3> التحضير للفحص:</h3>\n                        <p>يجب الصيام لمدة 9-12 ساعة قبل سحب العينة، مع السماح بشرب الماء فقط.</p>\n                    </div>\n                    \n                    <div class=\"detail-section\">\n                        <h3> مدة ظهور النتيجة:</h3>\n                        <p>تظهر نتائج التحليل عادةً خلال 24-48 ساعة.</p>\n                    </div>\n                </div>\n            \n                \n                \n                <div class=\"analysis-detail-card\">\n                    <h2> فحص الحديد</h2>\n                    \n                    <div class=\"detail-section\">\n                        <h3> الوصف:</h3>\n                        <p>الحديد معدن يحتاجه الجسم للنمو والتطور.</p>\n                    </div>\n                    \n                    <div class=\"detail-section\">\n                        <h3> الغرض من الفحص:</h3>\n                        <p>يقيس هذا الفحص كمية الحديد في دمك ويمكنه الكشف عن حالاتٍ مثل فقر الدم، أو زيادة الحديد في الجسم.</p>\n                    </div>\n                    \n                    <div class=\"detail-section\">\n                        <h3> التحضير للفحص:</h3>\n                        <ul class=\"detail-list\">\n                            <li>يُفضّل الصيام طوال الليل (8 ساعات) وأخذ عينة الدم في الصباح الباكر، نظرًا لاختلاف ساعات النهار، مما يؤدي إلى انخفاض تركيزات الحديد في المصل ومؤشر كتلة الجسم الكلي في فترة ما بعد الظهر مقارنةً بالصباح.</li>\n                            <li>لا تتناول أقراص الحديد لمدة ٢٤ ساعة قبل الاختبار.</li>\n                        </ul>\n                    </div>\n                    \n                    <div class=\"detail-section\">\n                        <h3> مدة الانتظار:</h3>\n                        <p>تظهر نتيجة التحليل عادة خلال يوم الى يومين.</p>\n                    </div>\n                </div>\n            ", "time": "\n                \n                \n                <div class=\"content-card\">\n                    <h2> تحاليل يتم إجراؤها في وقت معين</h2>\n                    \n                    <div class=\"time-tests-list\">\n                        <div class=\"time-test-item\">\n                            <h3> PT & PTT - سيولة الدم</h3>\n                            <p>يتم استقبال عينات الدم لهذا الفحص (الفترة الصباحية من الساعة 8 الى 11 صباحا، والفترة المسائية من الساعة 7 الى 8 مساءا) وفقا لوقت السيارة التي ستنقل العينات الى مستشفى حمد لضرورة نقل هذا التحليل في مدة زمنية معينه حتى لا تتأثر النتائج.</p>\n                        </div>\n                        \n                        <div class=\"time-test-item\">\n                            <h3> Quantiferon TB Plus</h3>\n                            <p>يتم جمع العينة من الأحد إلى الأربعاء من الساعة 7:00 الى 11:00 صباحا.</p>\n                        </div>\n                        \n                        <div class=\"time-test-item\">\n                            <h3> Iron Profile - الحديد</h3>\n                            <p>يُفضّل أخذ عينة دم في الصباح الباكر، نظرًا لأن التباين اليومي يؤدي إلى انخفاض تركيزات الحديد في فترة ما بعد الظهر مقارنةً بالصباح.</p>\n                        </div>\n                        \n                        <div class=\"time-test-item\">\n                            <h3> الكورتيزول</h3>\n                            <p>يفضل عمل التحليل اثناء الفترة الصباحية (8 صباحًا) والفترة المسائية (8 مساءً).</p>\n                        </div>\n                    </div>\n                </div>\n            ", "samples": "\n                \n                \n                <div class=\"content-card\">\n                    <h2> طرق جمع العينات</h2>\n                    \n                    <div class=\"sample-methods-list\">\n                        <div class=\"sample-method-item\">\n                            <h3> كيفية تجميع عينة البول الروتينية</h3>\n                            <p><strong>للبالغين:</strong></p>\n                            <ol>\n                                <li>اغسل يديك بالماء والصابون.</li>\n                                <li>نظف المنطقة التناسلية.</li>\n                                <li>افتح عبوة التحليل واترك كمية صغيرة من البول تمر إلى المرحاض ومن ثم قم بوضع منتصف عينة البول في العبوة.</li>\n                                <li>اغلق العبوة بإحكام وضعها في الكيس البلاستيك الخاص وقم بتسليمه إلى المختبر.</li>\n                            </ol>\n                            \n                            <p><strong>للأطفال:</strong></p>\n                            <ol>\n                                <li>احصل على الكيس البلاستيك المخصص لجمع عينات الأطفال من التقني.</li>\n                                <li>على الوالدين غسل الأيدي بالماء والصابون ومن ثم تنظيف المنطقة التناسلية للطفل ومن ثم وضع الكيس البلاستيك على المنطقة مباشرة بعد تبول الطفل فانزع الكيس وانقل البول إلى العبوة المخصصة لجميع البول.</li>\n                                <li>اغلق العبوة بإحكام وضعها في الكيس البلاستيك الخاص وقم بتسليمه إلى المختبر.</li>\n                            </ol>\n                        </div>\n                        \n                        <div class=\"sample-method-item\">\n                            <h3> كيفية تجميع عينات مزرعة البول</h3>\n                            <ul>\n                                <li>تأكد من استخدام العبوة المخصصة لفحص الزراعة والتي تحتوي على بودرة من حمض البوريك.</li>\n                                <li>يجب ملؤها إلى العلامة المحددة (20 مل) ومن ثم غلق العبوة وخلطها ثلاث مرات وتسليمها للمختبر.</li>\n                            </ul>\n                        </div>\n                        \n                        <div class=\"sample-method-item\">\n                            <h3> كيفية تجميع عينة البول لمدة 24 ساعة</h3>\n                            <ul>\n                                <li>الحصول على عبوة تجميع البول المناسبة والمخصصة للتحليل مع الكيس البلاستيك من المختبر.</li>\n                                <li>عند البدء بعملية التجميع، قم بإفراغ المثانة بشكل كامل في المرحاض، وقم بتسجيل الوقت بدءًا من ذلك الوقت.</li>\n                                <li>قم بتجميع البول داخل عبوة التجميع حتى نفس الوقت من اليوم التالي (وقت الانتهاء يجب أن يكون نفس وقت البدء في اليوم السابق).</li>\n                                <li>احفظ العبوة في الثلاجة خلال تجميع العينة.</li>\n                            </ul>\n                        </div>\n                        \n                        <div class=\"sample-method-item\">\n                            <h3> تعليمات لتجميع عينات البراز</h3>\n                            <ul>\n                                <li>احصل على العبوة المناسبة لفحص البراز وكذلك الكيس البلاستيك المخصص من المختبر.</li>\n                                <li>احرص على عدم مزج العينة بالبول أو ماء المرحاض أو دم الحيض (للنساء).</li>\n                                <li>يمكنك وضع مناديل ورقية كبيرة أو أي مادة مناسبة توضع فوق المرحاض بحيث لا يتلوث البراز بمياه المرحاض.</li>\n                                <li>باستخدام الملعقة الموجودة داخل عبوة التجميع، قم بأخذ عينات البراز من عدة مناطق وتأكد من وجود كمية صغيرة من البراز على الملعقة.</li>\n                            </ul>\n                        </div>\n                        \n                        <div class=\"sample-method-item\">\n                            <h3> فحص تحمل الجلوكوز في الدم (GTT)</h3>\n                            <ul>\n                                <li>يلزم الصيام الليلي من 8-10 ساعة.</li>\n                                <li>تناول نظام غذائي متوازن يحتوي على ما لا يقل عن 150 جرام من الكربوهيدرات يوميًا قبل الفحص بثلاثة أيام. يرجى استشارة الطبيب للحصول على المزيد من المعلومات.</li>\n                                <li>تجنب الأكل، الركوب، التدخين، المجهود البدني، والضغط النفسي حتى الانتهاء من إجراء التحليل.</li>\n                                <li>احرص على إبلاغ موظف المختبر عند التقيؤ خلال أي مرحلة من مراحل الاختبار.</li>\n                                <li>على المريض الحضور للمركز الصحي الساعة 8 صباحًا حيث سيمكث في المركز من 2 إلى 3 ساعة.</li>\n                            </ul>\n                        </div>\n                        \n                        <div class=\"sample-method-item\">\n                            <h3> فحص تحمل الجلوكوز للنساء الحوامل</h3>\n                            <ul>\n                                <li>سيتم جمع عينة الدم في حالة الصيام، ثم شرب محلول 75 جرام تليه أخذ عينات دم بعد الساعة الأولى والثانية من تناول محلول الجلوكوز.</li>\n                            </ul>\n                        </div>\n                        \n                        <div class=\"sample-method-item\">\n                            <h3> فحص تحمل الجلوكوز لغير الحوامل</h3>\n                            <ul>\n                                <li>سيتم جمع عينة الدم في حالة الصيام وبعد ساعتين من تناول 75 جرام من محلول الجلوكوز عن طريق الفم.</li>\n                            </ul>\n                        </div>\n                    </div>\n                </div>\n            ", "faq": "\n                \n                \n                <div class=\"content-card\">\n                    <h2> بعض التساؤلات</h2>\n                    \n                    <div class=\"faq-list\">\n                        <div class=\"faq-item\">\n                            <h3> هل يمكنني شرب أي شيء غير الماء أثناء الصيام؟</h3>\n                            <p>لا، قد تنتقل العصائر والقهوة والمشروبات الغازية وغيرها من المشروبات إلى مجرى الدم وتؤثر على نتائجك. ولكن يمكنك شرب الماء العادي. تجنب المياه الغازية بنكهة الليمون أو المنكهة، فقد تحتوي على سكريات أو محليات صناعية. الحفاظ على رطوبة الجسم يُسهّل عملية الفحص. ذلك لأن الماء يُساعد على الاحتفاظ بالمزيد من السوائل في الأوردة، مما يُسهّل أخذ عينة من الدم.</p>\n                        </div>\n                        \n                        <div class=\"faq-item\">\n                            <h3> هل يمكنني الاستمرار في تناول الدواء أثناء الصيام؟</h3>\n                            <p>اسأل طبيبك عما إذا كان من المقبول تناول أدويتك المعتادة الموصوفة طبيًا، قد يُطلب منك التوقف عن تناول أدويتك. لكن لا تتوقف عن تناول أدويتك إلا إذا طلب منك طبيبك ذلك. أخبر طبيبك أيضًا بأي فيتامينات ومكملات غذائية تتناولها. بهذه الطريقة ستضمن تجنب أي شيء قد يؤثر على نتائج فحوصاتك.</p>\n                        </div>\n                        \n                        <div class=\"faq-item\">\n                            <h3> ماذا لو أخطأتُ في تناول الطعام أو الشراب غير الماء أثناء صيامي؟</h3>\n                            <p>أخبر طبيبك إذا تناولت الطعام أو الشراب قبل الفحص. قد تحتاج إلى تأجيل الفحص إلى وقتٍ آخر يسمح لك بالصيام لضمان الحصول على نتائج دقيقة.</p>\n                        </div>\n                        \n                        <div class=\"faq-item\">\n                            <h3> متى يمكنني تناول الطعام والشراب بشكل طبيعي؟</h3>\n                            <p>يمكنك تناول الطعام فور انتهاء الفحص.</p>\n                        </div>\n                    </div>\n                </div>\n            "}, "en": {"fasting": "\n                \n                </div>\n                \n                <div class=\"content-card\">\n                    <h2> Information About Fasting Tests</h2>\n                    <p>Here are some examples of tests that require fasting before performing:</p>\n                    \n                    <div class=\"analysis-list\">\n                        <div class=\"analysis-item\">\n                            <h3> Fasting Blood Sugar</h3>\n                            <p>Requires fasting for 8-12 hours before sample collection.</p>\n                        </div>\n                        <div class=\"analysis-item\">\n                            <h3> Cholesterol and Lipids</h3>\n                            <p>Requires fasting for 9-12 hours for accurate results.</p>\n                        </div>\n                        <div class=\"analysis-item\">\n                            <h3> Iron Test</h3>\n                            <p>Requires fasting for 8 hours before the test.</p>\n                        </div>\n                    </div>\n                    \n                    <div class=\"instructions\">\n                        <h3> Important Instructions</h3>\n                        <ul>\n                            <li>Only water is allowed during the fasting period.</li>\n                            <li>Avoid smoking during the fasting period.</li>\n                            <li>Follow your doctor's instructions carefully.</li>\n                            <li>Inform the technician about any medications you're taking.</li>\n                            <li>It's preferable to perform tests early in the morning.</li>\n                        </ul>\n                    </div>\n                </div>\n            \n                \n                \n                <div class=\"analysis-detail-card\">\n                    <h2> Fasting Blood Sugar Test</h2>\n                    \n                    <div class=\"detail-section\">\n                        <h3> Description:</h3>\n                        <p>Blood test that measures the level of glucose (sugar) in the blood, which is the main source of energy for the body.</p>\n                    </div>\n                    \n                    <div class=\"detail-section\">\n                        <h3> Purpose of the Test:</h3>\n                        <ul class=\"detail-list\">\n                            <li>Used to diagnose diabetes</li>\n                            <li>Monitor blood sugar levels in diabetic patients</li>\n                            <li>Identify low or high blood sugar levels</li>\n                        </ul>\n                    </div>\n                    \n                    <div class=\"detail-section\">\n                        <h3> Preparation for the Test:</h3>\n                        <p>Blood sample is collected in the morning after fasting for at least 8 hours.</p>\n                    </div>\n                    \n                    <div class=\"detail-section\">\n                        <h3> Result Time:</h3>\n                        <p>Test results appear the next day.</p>\n                    </div>\n                </div>\n            \n                \n                \n                <div class=\"analysis-detail-card\">\n                    <h2> Cholesterol and Lipids Test</h2>\n                    \n                    <div class=\"detail-section\">\n                        <h3> Description:</h3>\n                        <p>A test that measures the level of fats in the blood, including total cholesterol, good cholesterol (HDL), bad cholesterol (LDL), and triglycerides.</p>\n                    </div>\n                    \n                    <div class=\"detail-section\">\n                        <h3> Purpose of the Test:</h3>\n                        <ul class=\"detail-list\">\n                            <li>Assess the risk of cardiovascular diseases</li>\n                            <li>Monitor the effectiveness of lipid-lowering treatment</li>\n                            <li>Detect blood lipid disorders</li>\n                            <li>Guide treatment and prevention decisions</li>\n                        </ul>\n                    </div>\n                    \n                    <div class=\"detail-section\">\n                        <h3> Preparation for the Test:</h3>\n                        <p>Must fast for 9-12 hours before sample collection, with only water allowed.</p>\n                    </div>\n                    \n                    <div class=\"detail-section\">\n                        <h3> Result Time:</h3>\n                        <p>Test results usually appear within 24-48 hours.</p>\n                    </div>\n                </div>\n            \n                \n                \n                <div class=\"analysis-detail-card\">\n                    <h2> Iron Test</h2>\n                    \n                    <div class=\"detail-section\">\n                        <h3> Description:</h3>\n                        <p>Iron is a mineral that the body needs for growth and development.</p>\n                    </div>\n                    \n                    <div class=\"detail-section\">\n                        <h3> Purpose of the Test:</h3>\n                        <p>This test measures the amount of iron in your blood and can detect conditions such as anemia or iron overload in the body.</p>\n                    </div>\n                    \n                    <div class=\"detail-section\">\n                        <h3> Preparation for the Test:</h3>\n                        <ul class=\"detail-list\">\n                            <li>It is preferable to fast overnight (8 hours) and take a blood sample early in the morning, due to the variation during the day, which leads to lower iron concentrations in serum and total body mass index in the afternoon compared to the morning.</li>\n                            <li>Do not take iron tablets for 24 hours before the test.</li>\n                        </ul>\n                    </div>\n                    \n                    <div class=\"detail-section\">\n                        <h3> Waiting Time:</h3>\n                        <p>Test results usually appear within one to two days.</p>\n                    </div>\n                </div>\n            ", "time": "\n                \n                \n                <div class=\"content-card\">\n                    <h2> Time-Specific Tests</h2>\n                    \n                    <div class=\"time-tests-list\">\n                        <div class=\"time-test-item\">\n                            <h3> PT & PTT - Blood Coagulation</h3>\n                            <p>Blood samples for this test are received (morning period from 8 to 11 am, and evening period from 7 to 8 pm) according to the time of the vehicle that will transport the samples to Hamad Hospital due to the need to transfer this analysis within a specific time period so that the results are not affected.</p>\n                        </div>\n                        \n                        <div class=\"time-test-item\">\n                            <h3> Quantiferon TB Plus</h3>\n                            <p>The sample is collected from Sunday to Wednesday from 7:00 to 11:00 am.</p>\n                        </div>\n                        \n                        <div class=\"time-test-item\">\n                            <h3> Iron Profile</h3>\n                            <p>It is preferable to take a blood sample early in the morning, as the daily variation leads to lower iron concentrations in the afternoon compared to the morning.</p>\n                        </div>\n                        \n                        <div class=\"time-test-item\">\n                            <h3> Cortisol</h3>\n                            <p>It is preferable to perform the test during the morning period (8 am) and the evening period (8 pm).</p>\n                        </div>\n                    </div>\n                </div>\n            ", "samples": "\n                \n                \n                <div class=\"content-card\">\n                    <h2> Sample Collection Methods</h2>\n                    \n                    <div class=\"sample-methods-list\">\n                        <div class=\"sample-method-item\">\n                            <h3> How to Collect Routine Urine Sample</h3>\n                            <p><strong>For Adults:</strong></p>\n                            <ol>\n                                <li>Wash your hands with water and soap.</li>\n                                <li>Clean the genital area.</li>\n                                <li>Open the test container and let a small amount of urine pass into the toilet, then place the midstream urine sample in the container.</li>\n                                <li>Close the container tightly and place it in the special plastic bag and deliver it to the laboratory.</li>\n                            </ol>\n                            \n                            <p><strong>For Children:</strong></p>\n                            <ol>\n                                <li>Get the plastic bag designated for collecting children's samples from the technician.</li>\n                                <li>Parents should wash their hands with water and soap, then clean the child's genital area, then place the plastic bag directly on the area after the child urinates, remove the bag and transfer the urine to the container designated for urine collection.</li>\n                                <li>Close the container tightly and place it in the special plastic bag and deliver it to the laboratory.</li>\n                            </ol>\n                        </div>\n                        \n                        <div class=\"sample-method-item\">\n                            <h3> How to Collect Urine Culture Samples</h3>\n                            <ul>\n                                <li>Make sure to use the container designated for the culture test, which contains boric acid powder.</li>\n                                <li>It should be filled to the specified mark (20 ml), then close the container, mix it three times, and deliver it to the laboratory.</li>\n                            </ul>\n                        </div>\n                        \n                        <div class=\"sample-method-item\">\n                            <h3> How to Collect 24-Hour Urine Sample</h3>\n                            <ul>\n                                <li>Obtain the appropriate urine collection container designated for the analysis along with the plastic bag from the laboratory.</li>\n                                <li>When starting the collection process, empty your bladder completely into the toilet, and record the time starting from that time.</li>\n                                <li>Collect urine inside the collection container until the same time the next day (the end time should be the same as the start time from the previous day).</li>\n                                <li>Keep the container in the refrigerator during sample collection.</li>\n                            </ul>\n                        </div>\n                        \n                        <div class=\"sample-method-item\">\n                            <h3> Instructions for Collecting Stool Samples</h3>\n                            <ul>\n                                <li>Obtain the appropriate container for stool examination and the designated plastic bag from the laboratory.</li>\n                                <li>Be careful not to mix the sample with urine, toilet water, or menstrual blood (for women).</li>\n                                <li>You can place large paper towels or any suitable material placed over the toilet so that the stool is not contaminated with toilet water.</li>\n                                <li>Using the spoon inside the collection container, take stool samples from several areas and make sure there is a small amount of stool on the spoon.</li>\n                            </ul>\n                        </div>\n                        \n                        <div class=\"sample-method-item\">\n                            <h3> Glucose Tolerance Test (GTT)</h3>\n                            <ul>\n                                <li>Overnight fasting for 8-10 hours is required.</li>\n                                <li>Eat a balanced diet containing at least 150 grams of carbohydrates daily for three days before the test. Please consult your doctor for more information.</li>\n                                <li>Avoid eating, riding, smoking, physical exertion, and psychological stress until the test is completed.</li>\n                                <li>Be sure to inform the laboratory staff if vomiting occurs during any stage of the test.</li>\n                                <li>The patient should come to the health center at 8 am and will stay at the center for 2 to 3 hours.</li>\n                            </ul>\n                        </div>\n                        \n                        <div class=\"sample-method-item\">\n                            <h3> Glucose Tolerance Test for Pregnant Women</h3>\n                            <ul>\n                                <li>A blood sample will be collected in a fasting state, then drink a 75-gram solution followed by taking blood samples after the first and second hours of consuming the glucose solution.</li>\n                            </ul>\n                        </div>\n                        \n                        <div class=\"sample-method-item\">\n                            <h3> Glucose Tolerance Test for Non-Pregnant Women</h3>\n                            <ul>\n                                <li>A blood sample will be collected in a fasting state and two hours after consuming 75 grams of glucose solution orally.</li>\n                            </ul>\n                        </div>\n                    </div>\n                </div>\n            ", "faq": "\n                \n                \n                <div class=\"content-card\">\n                    <h2> Frequently Asked Questions</h2>\n                    \n                    <div class=\"faq-list\">\n                        <div class=\"faq-item\">\n                            <h3> Can I drink anything other than water while fasting?</h3>\n                            <p>No, juices, coffee, soft drinks, and other beverages may enter the bloodstream and affect your results. But you can drink plain water. Avoid lemon-flavored or flavored carbonated water, as it may contain sugars or artificial sweeteners. Keeping the body hydrated facilitates the examination process. This is because water helps retain more fluids in the veins, making it easier to take a blood sample.</p>\n                        </div>\n                        \n                        <div class=\"faq-item\">\n                            <h3> Can I continue taking medication while fasting?</h3>\n                            <p>Ask your doctor if it is acceptable to take your usual medically prescribed medications. You may be asked to stop taking your medications. But do not stop taking your medications unless your doctor asks you to. Also tell your doctor about any vitamins and dietary supplements you are taking. This way you will ensure avoiding anything that may affect your test results.</p>\n                        </div>\n                        \n                        <div class=\"faq-item\">\n                            <h3> What if I mistakenly eat or drink something other than water during my fast?</h3>\n                            <p>Tell your doctor if you ate or drank before the test. You may need to postpone the test to another time that allows you to fast to ensure accurate results.</p>\n                        </div>\n                        \n                        <div class=\"faq-item\">\n                            <h3> When can I eat and drink normally?</h3>\n                            <p>You can eat immediately after the test is completed.</p>\n                        </div>\n                    </div>\n                </div>\n            "}};
const copy={ar:{brand:'مركز المشاف الصحي<small>المختبر · دليل الفحوصات الطبية</small>',eye:'دليل المريض',heading:'تعليمات واضحة.<br>تحضير أفضل لفحوصاتك.',intro:'تعرّف على متطلبات التحضير، مواعيد الفحوصات وطرق جمع العينات، في دليل واحد سهل الاستخدام.',tabs:['الصيام والتحضير','مواعيد الفحوصات','جمع العينات','أسئلة شائعة'],search:'ابحث عن فحص أو تعليمات…',print:'طباعة التعليمات',empty:'لا توجد نتائج مطابقة. جرّب كلمة أخرى.',notice:'اتبع تعليمات الطبيب والمختبر الخاصة بفحصك. لا توقف أدويتك من تلقاء نفسك. مواعيد جمع العينات الواردة تخص المركز كما وردت في الدليل الأصلي؛ تأكد من المختبر قبل الحضور.',footer:'جميع الحقوق محفوظة © مؤسسة الرعاية الصحية الأولية — مركز المشاف الصحي'},en:{brand:'Al Mashaf Health Center<small>Laboratory · Medical tests guide</small>',eye:'Patient guide',heading:'Clear instructions.<br>Better preparation.',intro:'Find preparation requirements, collection schedules and sample collection instructions in one accessible guide.',tabs:['Fasting & preparation','Test schedules','Sample collection','Common questions'],search:'Search for a test or instructions…',print:'Print instructions',empty:'No matching results. Try another keyword.',notice:'Follow the instructions provided by your doctor and laboratory for your test. Do not stop medicines on your own. Collection schedules are center-specific and reproduced from the original guide; confirm with the laboratory before attending.',footer:'All rights reserved © Primary Health Care Corporation — Al Mashaf Health Center'}};
let lang=localStorage.getItem('guideLanguage')||'ar',active='fasting';if(!copy[lang])lang='ar';const keys=['fasting','time','samples','faq'];const el=id=>document.getElementById(id);
function render(){const c=copy[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';for(const [id,value] of Object.entries({brand:c.brand,eyebrow:c.eye,heading:c.heading,intro:c.intro,print:c.print,empty:c.empty,notice:c.notice,footer:c.footer}))el(id).innerHTML=value;el('language').textContent=lang==='ar'?'English':'العربية';el('search').placeholder=c.search;el('search').setAttribute('aria-label',c.search);el('clear').setAttribute('aria-label',lang==='ar'?'مسح البحث':'Clear search');el('top').setAttribute('aria-label',lang==='ar'?'العودة للأعلى':'Back to top');document.querySelector('.tabs').innerHTML=keys.map((k,i)=>`<button data-key="${k}" class="${active===k?'active':''}" aria-pressed="${active===k}">${c.tabs[i]}</button>`).join('');document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{active=b.dataset.key;el('search').value='';render()});el('section-title').textContent=c.tabs[keys.indexOf(active)];el('content').innerHTML=DATA[lang][active];filter();}
function filter(){const query=el('search').value.trim().toLowerCase();if(query){el('content').innerHTML=keys.map(k=>DATA[lang][k]).join('');el('section-title').textContent=lang==='ar'?'نتائج البحث':'Search results';}else{el('content').innerHTML=DATA[lang][active];el('section-title').textContent=copy[lang].tabs[keys.indexOf(active)];}let visible=0;const cards=el('content').querySelectorAll('.content-card,.analysis-detail-card,.time-test-item,.sample-method-item,.faq-item');cards.forEach(card=>{const match=!query||card.textContent.toLowerCase().includes(query);card.classList.toggle('hidden',!match);if(match)visible++});el('empty').classList.toggle('hidden',visible>0);}
el('language').onclick=()=>{lang=lang==='ar'?'en':'ar';localStorage.setItem('guideLanguage',lang);el('search').value='';render()};el('search').oninput=filter;el('clear').onclick=()=>{el('search').value='';filter();el('search').focus()};el('print').onclick=()=>window.print();el('top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});render();
</script></body></html>
